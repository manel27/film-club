<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Film Club</title>
    <script>
      // Applies the saved theme before first paint (no flash). Keep the ids and
      // key in sync with src/theme.ts. No saved theme: follow the OS setting.
      try {
        var theme = localStorage.getItem('film-club-theme')
        if (!/^(superman|batman|letterboxd)$/.test(theme)) {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'batman' : 'superman'
        }
        document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
