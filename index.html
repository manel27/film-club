<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Production builds add a CSP <meta> after the charset (vite.config.ts; hashes the inline script and style). -->
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Film Club</title>
    <!-- Clickjacking guard: GitHub Pages can't send frame-ancestors, so the page stays hidden inside a frame. -->
    <style id="frame-guard">
      html {
        display: none !important;
      }
    </style>
    <script>
      if (window.top === window.self) document.getElementById('frame-guard').remove()
      // Applies the saved theme before first paint (no flash). Keep the ids and
      // key in sync with src/theme.ts. No saved theme: Letterboxd.
      try {
        var theme = localStorage.getItem('film-club-theme')
        if (!/^(superman|batman|letterboxd)$/.test(theme)) {
          theme = 'letterboxd'
        }
        document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
