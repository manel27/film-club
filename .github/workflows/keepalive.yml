name: Keep-alive

# The free Supabase plan pauses a project after a period of inactivity
# (plan 2.4). Every 3 days this calls keepalive(), a read-only RPC that always
# returns true. A failed run makes GitHub email the repository owner: that
# email is the alert. GitHub disables schedules in public repos after 60 days
# with no repository activity; re-enable with "Enable workflow" in the Actions
# tab (a commit alone doesn't).

on:
  schedule:
    - cron: '23 5 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call keepalive()
        env:
          # Public values (already in the built site), not secrets.
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # --retry: timeouts and 408/429/5xx only (a 401 is not retried).
          # || true: on an error, still echo Supabase's message; the check below fails the job.
          body=$(curl --fail-with-body -sS --retry 3 --retry-delay 20 --max-time 30 \
            -X POST "$URL/rest/v1/rpc/keepalive" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}') || true
          echo "Response: $body"
          [ "$body" = "true" ] || { echo "::error::Expected true from keepalive()"; exit 1; }
