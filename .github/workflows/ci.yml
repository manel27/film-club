name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # From gitleaks_8.30.1_checksums.txt on the v8.30.1 release.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$TARBALL" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}"
          echo "${GITLEAKS_SHA256}  ${TARBALL}" | sha256sum -c -
          tar -xzf "$TARBALL" gitleaks
          rm "$TARBALL"
      - name: Scan full history
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose

  migration:
    name: Migration parser tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A pull request that touches neither migration/ nor the workflows skips the
      # rest of this job; it still reports success, so the required check passes.
      # Pushes to main run everything.
      - name: Is this job needed?
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch --no-tags --depth=1 origin "$BASE"
          changed=$(git diff --name-only "$BASE" HEAD)
          echo "$changed"
          if echo "$changed" | grep -qE '^(migration/|\.github/workflows/)'; then run=true; else run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "### Job needed: $run" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: python -m pip install -r migration/requirements.txt
      - name: Unit tests (synthetic fixture only)
        if: steps.scope.outputs.run == 'true'
        run: python -I -m unittest discover -s migration/tests -t . -v

  build:
    name: Lint, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # The Vitest suite, once, with coverage (thresholds in vitest.config.ts).
      - run: npm run test:coverage
      - name: Coverage summary (Vitest)
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: >-
          node -e "const t = require('./coverage/coverage-summary.json').total;
          console.log('### Front-end coverage (Vitest)\n\n| Metric | % | Covered / total |\n| --- | --- | --- |\n' +
          ['lines', 'statements', 'branches', 'functions'].map((k) =>
          '| ' + k + ' | ' + t[k].pct + ' | ' + t[k].covered + ' / ' + t[k].total + ' |').join('\n'))"
          >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report (Vitest)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-vitest
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7
      # The real build, with the project's public URL and publishable key.
      - run: npm run build
      # E2E runs against a throwaway LOCAL Supabase stack (synthetic seed,
      # its own dev keys from `supabase status`), never the hosted project.
      # Playwright builds a separate copy of the app into dist-e2e/ pointed
      # at it. Output is discarded: it only lists local URLs and demo keys.
      # The Edge Functions call a fake TMDB that the e2e setup starts
      # (e2e/tmdbStub.ts); the token is a placeholder, real TMDB is never used.
      - name: Point the local Edge Functions at the fake TMDB
        run: npm run functions:env # the same script as locally, so the two can't drift
      - name: Start local Supabase (for e2e)
        run: >-
          npx supabase start
          -x realtime,storage-api,imgproxy,mailpit,studio,logflare,vector,supavisor
          > /dev/null
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright e2e
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Upload e2e screenshots (synthetic data only)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: test-results/screenshots/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup

  database:
    name: Database (migrations, pgTAP, types)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A pull request that touches none of supabase/, the generated types, the npm
      # or Node versions or the workflows skips the rest of this job; it still
      # reports success, so the required check passes. Pushes to main run everything.
      - name: Is this job needed?
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch --no-tags --depth=1 origin "$BASE"
          changed=$(git diff --name-only "$BASE" HEAD)
          echo "$changed"
          if echo "$changed" | grep -qE '^(supabase/|src/lib/database\.types\.ts$|package(-lock)?\.json$|\.nvmrc$|\.github/workflows/)'; then run=true; else run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "### Job needed: $run" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.scope.outputs.run == 'true'
      # Applies every migration, then seed.sql + test_helpers.sql (synthetic
      # data only). Services the tests don't need are skipped. Output is
      # discarded: it only lists local, throwaway URLs and demo keys.
      - name: Start local Supabase
        if: steps.scope.outputs.run == 'true'
        run: >-
          npx supabase start
          -x realtime,storage-api,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor
          > /dev/null
      - name: Lint database functions
        if: steps.scope.outputs.run == 'true'
        run: npx supabase db lint -s public,app --level warning --fail-on warning
      - name: pgTAP tests (RLS, permissions, duplicates, score lock)
        if: steps.scope.outputs.run == 'true'
        run: npx supabase test db
      # Edge Functions: run in-process against this stack, TMDB replaced by a
      # stub server inside the test (supabase/functions/tests).
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: steps.scope.outputs.run == 'true'
        with:
          deno-version: v2.5.6
      - name: Edge Functions format and type check (Deno)
        if: steps.scope.outputs.run == 'true'
        run: npm run functions:check
      - name: Edge Functions tests with coverage (Deno, fake TMDB)
        if: steps.scope.outputs.run == 'true'
        run: npm run functions:coverage
      # Function source only (_shared + each function; tests/ excluded).
      # deno coverage has no threshold flag: check the "All files" line % here.
      - name: Edge Functions coverage (lines >= 75%)
        if: steps.scope.outputs.run == 'true'
        env:
          NO_COLOR: '1'
        run: |
          report=$(deno coverage coverage/deno --include=supabase/functions/ --exclude=supabase/functions/tests/)
          echo "$report"
          printf '### Edge Functions coverage (Deno)\n\n%s\n' "$report" >> "$GITHUB_STEP_SUMMARY"
          lines=$(echo "$report" | awk -F'|' '/All files/ {gsub(/ /, "", $4); print $4}')
          awk -v l="$lines" 'BEGIN { exit !(l >= 75) }' ||
            { echo "::error::Deno line coverage ${lines:-?}% is below 75%"; exit 1; }
      - name: Upload coverage report (Deno)
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-deno
          path: coverage/deno/html/
          if-no-files-found: ignore
          retention-days: 7
      - name: Generated types are up to date
        if: steps.scope.outputs.run == 'true'
        run: |
          npm run db:types
          git diff --exit-code -- src/lib/database.types.ts
      - name: Stop local Supabase
        if: always() && steps.scope.outputs.run == 'true'
        run: npx supabase stop --no-backup
